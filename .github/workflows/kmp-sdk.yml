name: KMP SDK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-jvm:
    name: Android and JVM SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Run SDK tests and Android compilation
        working-directory: sdks/kmp
        run: |
          chmod +x gradlew
          ./gradlew :sdk:jvmTest :sdk:allTests :sdk:compileAndroidMain

      - name: Check formatting and source tree
        working-directory: sdks/kmp
        run: |
          chmod +x gradlew
          ./gradlew :sdk:verifyCanonicalProto :sdk:check

  ios-framework:
    name: iOS framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile iOS simulator framework
        working-directory: sdks/kmp
        run: |
          chmod +x gradlew
          ./gradlew :sdk:linkDebugFrameworkIosSimulatorArm64
